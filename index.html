<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Oscura - Códice Jerárquico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #e2e8f0; }
        h1, h2, h3 { font-family: 'Cinzel', serif; }
        .glow-purple { box-shadow: 0 0 20px rgba(147, 51, 234, 0.1); }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #4c1d95; border-radius: 10px; }
        input { color-scheme: dark; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
  apiKey: "AIzaSyCRdip4voDHkV_b5r_Wl722fX8j7zUxTKg",
  authDomain: "aura-oscura.firebaseapp.com",
  projectId: "aura-oscura",
  storageBucket: "aura-oscura.firebasestorage.app",
  messagingSenderId: "628625847037",
  appId: "1:628625847037:web:eaaeea7059a7b4695ec494"
};

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();
        const ADMIN_EMAIL = "manuel943006@gmail.com"; 

        window.login = () => signInWithPopup(auth, provider);
        window.logout = () => signOut(auth);

        // --- GESTIÓN DE JUGADORES Y PUEBLOS ---

        // 1. Guardar Jugador y su primer pueblo
        window.saveNewPlayer = async () => {
            if (auth.currentUser?.email !== ADMIN_EMAIL) return alert("No autorizado");
            
            const nombre = document.getElementById('playerName').value;
            const x = document.getElementById('pX').value;
            const y = document.getElementById('pY').value;

            if(!nombre || !x || !y) return alert("Datos incompletos");

            try {
                // Creamos el jugador
                const playerRef = await addDoc(collection(db, "miembros"), { nombre });
                // Añadimos su primer pueblo a una subcolección
                await addDoc(collection(db, "miembros", playerRef.id, "pueblos"), { 
                    coords: `${x}|${y}`,
                    fecha: new Date()
                });
                
                document.getElementById('playerName').value = "";
                document.getElementById('pX').value = ""; document.getElementById('pY').value = "";
            } catch (e) { alert(e.message); }
        };

        // 2. Añadir pueblo extra a un jugador existente
        window.addVillageToPlayer = async (playerId) => {
            const x = prompt("Coordenada X:");
            const y = prompt("Coordenada Y:");
            if(!x || !y) return;

            await addDoc(collection(db, "miembros", playerId, "pueblos"), { 
                coords: `${x}|${y}`,
                fecha: new Date()
            });
        };

        // 3. Eliminar Jugador completo
        window.deleteFullPlayer = async (id) => {
            if (confirm("¿Eliminar al jugador y todos sus pueblos?")) {
                await deleteDoc(doc(db, "miembros", id));
            }
        };

        // 4. LISTADO JERÁRQUICO
        onSnapshot(collection(db, "miembros"), (snapshot) => {
            const lista = document.getElementById('codiceLista');
            lista.innerHTML = "";

            snapshot.forEach((playerDoc) => {
                const player = playerDoc.data();
                const playerDiv = document.createElement('div');
                playerDiv.className = "bg-slate-900/80 p-4 rounded-xl border border-purple-900/30 mb-4 glow-purple";
                
                playerDiv.innerHTML = `
                    <div class="flex justify-between items-center border-b border-purple-900/20 pb-2 mb-3">
                        <h3 class="text-purple-400 font-bold uppercase tracking-widest text-sm">${player.nombre}</h3>
                        <div class="flex gap-2">
                            <button onclick="addVillageToPlayer('${playerDoc.id}')" class="text-[10px] bg-purple-900/40 px-2 py-1 rounded hover:bg-purple-600 transition">+ Pueblo</button>
                            <button onclick="deleteFullPlayer('${playerDoc.id}')" class="text-red-500 text-xs">✕</button>
                        </div>
                    </div>
                    <div id="pueblos-${playerDoc.id}" class="grid grid-cols-2 gap-2 text-[11px]"></div>
                `;
                lista.appendChild(playerDiv);

                // Escuchar subcolección de pueblos para este jugador
                onSnapshot(collection(db, "miembros", playerDoc.id, "pueblos"), (pSnapshot) => {
                    const pueblosDiv = document.getElementById(`pueblos-${playerDoc.id}`);
                    pueblosDiv.innerHTML = "";
                    pSnapshot.forEach(pDoc => {
                        pueblosDiv.innerHTML += `<div class="bg-black/40 p-1.5 rounded text-slate-400 font-mono text-center border border-slate-800">${pDoc.data().coords}</div>`;
                    });
                });
            });
        });

        // --- CALCULADORA (Búsqueda en toda la jerarquía) ---
        window.calcularAtaque = async () => {
            const ox = document.getElementById('origX').value; const oy = document.getElementById('origY').value;
            const dx = document.getElementById('destX').value; const dy = document.getElementById('destY').value;
            const fechaLlegada = new Date(document.getElementById('horaLlegada').value);
            if(!ox || !oy || !dx || !dy || isNaN(fechaLlegada)) return alert("Faltan datos");

            const dist = Math.sqrt(Math.pow(dx-ox, 2) + Math.pow(dy-oy, 2));
            const minFaltantes = (fechaLlegada - new Date()) / 60000;

            // Identificación simple
            let resIdent = `<p class="text-center text-red-500 text-xs font-bold mb-2">IDENTIFICACIÓN:</p>`;
            [{n:"Ligera",v:10},{n:"Hachas",v:18},{n:"Espadas",v:22},{n:"Arietes",v:30},{n:"Noble",v:35}].forEach(u => {
                const t = dist * u.v;
                if(minFaltantes >= t) resIdent += `<div class="text-[10px] flex justify-between border-b border-slate-800 py-1"><span>${u.n}</span><span class="text-green-500">SI</span></div>`;
            });
            document.getElementById('resCalc').innerHTML = resIdent;

            // Búsqueda de cercanía en todos los usuarios
            const mSnap = await getDocs(collection(db, "miembros"));
            let todosLosPueblos = [];
            
            for (const mDoc of mSnap.docs) {
                const pSnap = await getDocs(collection(db, "miembros", mDoc.id, "pueblos"));
                pSnap.forEach(pDoc => {
                    const [px, py] = pDoc.data().coords.split('|');
                    const d = Math.sqrt(Math.pow(dx-px, 2) + Math.pow(dy-py, 2));
                    todosLosPueblos.push({ nombre: mDoc.data().nombre, coords: pDoc.data().coords, d });
                });
            }
            
            todosLosPueblos.sort((a,b) => a.d - b.d);
            let resCer = `<p class="text-center text-purple-500 text-xs font-bold mb-2">APOYOS:</p>`;
            todosLosPueblos.slice(0, 5).forEach(p => {
                resCer += `<div class="text-[9px] mb-1 bg-slate-900 p-1 rounded flex justify-between"><span>${p.nombre}</span><span class="text-purple-400">${p.d.toFixed(1)}c</span></div>`;
            });
            document.getElementById('listaCercania').innerHTML = resCer;
        };

        onAuthStateChanged(auth, (user) => {
            const area = document.getElementById('authArea');
            if (user) { area.innerHTML = `<button onclick="logout()" class="text-[10px] bg-red-900/30 border border-red-800 p-1 rounded">Salir</button>`; }
            else { area.innerHTML = `<button onclick="login()" class="text-[10px] bg-purple-900/30 border border-purple-800 p-1 rounded">Login</button>`; }
        });
    </script>
</head>
<body class="p-4 flex flex-col items-center">
    
    <div class="w-full max-w-5xl">
        <header class="flex justify-between items-center mb-8 border-b border-purple-900/20 pb-4">
            <h1 class="text-2xl font-black tracking-widest text-purple-600">AURA OSCURA</h1>
            <div id="authArea"></div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            
            <!-- SECCIÓN JUGADORES -->
            <section>
                <div class="bg-slate-900/40 p-6 rounded-2xl border border-purple-900/20 mb-6">
                    <h2 class="text-xs font-bold text-purple-400 uppercase mb-4 tracking-widest">Nuevo Miembro</h2>
                    <input type="text" id="playerName" placeholder="Nombre Jugador" class="w-full bg-black/40 p-2 rounded mb-2 border border-slate-800 text-sm">
                    <div class="flex gap-2 mb-4">
                        <input type="number" id="pX" placeholder="X" class="w-1/2 bg-black/40 p-2 rounded border border-slate-800 text-center">
                        <input type="number" id="pY" placeholder="Y" class="w-1/2 bg-black/40 p-2 rounded border border-slate-800 text-center">
                    </div>
                    <button onclick="saveNewPlayer()" class="w-full bg-purple-700 py-2 rounded font-bold text-xs uppercase tracking-widest">Registrar Jugador</button>
                </div>

                <h2 class="text-[10px] font-bold text-slate-500 uppercase mb-4 tracking-[0.3em]">Códice de la Tribu</h2>
                <div id="codiceLista" class="max-h-[500px] overflow-y-auto pr-2 custom-scroll">
                    <!-- Jugadores y pueblos aparecerán aquí -->
                </div>
            </section>

            <!-- CALCULADORA -->
            <section class="bg-slate-900/40 p-6 rounded-2xl border border-red-900/20 self-start">
                <h2 class="text-xs font-bold text-red-500 uppercase mb-4 tracking-widest">Oráculo de Guerra</h2>
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div class="flex flex-col gap-1">
                        <span class="text-[9px] text-slate-500">Origen</span>
                        <div class="flex gap-1"><input type="number" id="origX" class="w-1/2 bg-black/40 p-2 rounded text-center"><input type="number" id="origY" class="w-1/2 bg-black/40 p-2 rounded text-center"></div>
                    </div>
                    <div class="flex flex-col gap-1">
                        <span class="text-[9px] text-slate-500">Destino</span>
                        <div class="flex gap-1"><input type="number" id="destX" class="w-1/2 bg-black/40 p-2 rounded text-center"><input type="number" id="destY" class="w-1/2 bg-black/40 p-2 rounded text-center"></div>
                    </div>
                </div>
                <input type="datetime-local" id="horaLlegada" class="w-full bg-black/40 p-2 rounded mb-4 text-xs">
                <button onclick="calcularAtaque()" class="w-full bg-red-800 py-3 rounded font-bold text-xs uppercase tracking-widest mb-6">Analizar</button>
                
                <div class="grid grid-cols-2 gap-4">
                    <div id="resCalc" class="bg-black/60 p-3 rounded-xl border border-slate-900 min-h-[100px]"></div>
                    <div id="listaCercania" class="bg-black/60 p-3 rounded-xl border border-slate-900 min-h-[100px]"></div>
                </div>
            </section>
        </div>
    </div>

</body>
</html>
