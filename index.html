<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Oscura - Dashboard de Guerra</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; }
        h1, h2, h3, .title-font { font-family: 'Cinzel', serif; }
        .glow-purple { box-shadow: 0 0 20px rgba(147, 51, 234, 0.2); }
        .glow-red { box-shadow: 0 0 20px rgba(220, 38, 38, 0.2); }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // --- CONFIGURACIÓN DE FIREBASE ---
        const firebaseConfig = {
  apiKey: "AIzaSyCRdip4voDHkV_b5r_Wl722fX8j7zUxTKg",
  authDomain: "aura-oscura.firebaseapp.com",
  projectId: "aura-oscura",
  storageBucket: "aura-oscura.firebasestorage.app",
  messagingSenderId: "628625847037",
  appId: "1:628625847037:web:eaaeea7059a7b4695ec494"
};

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();
        const ADMIN_EMAIL = "manuel943006@gmail.com"; 

        // --- FUNCIONES DE AUTH ---
        window.login = async () => {
            try { await signInWithPopup(auth, provider); } 
            catch (error) { alert("Error: " + error.message); }
        };

        window.logout = async () => {
            try { await signOut(auth); alert("Sesión cerrada"); } 
            catch (error) { alert("Error al salir"); }
        };

        // --- GESTIÓN DE DATOS ---
        window.saveData = async () => {
            const user = auth.currentUser;
            if (!user || user.email !== ADMIN_EMAIL) return alert("No tienes permiso.");
            
            const nombre = document.getElementById('name').value;
            const x = document.getElementById('regX').value;
            const y = document.getElementById('regY').value;
            
            if(!nombre || !x || !y) return alert("Completa todos los campos rituales.");

            await addDoc(collection(db, "jugadores"), { nombre, coords: `${x}|${y}` });
            document.getElementById('name').value = "";
            document.getElementById('regX').value = "";
            document.getElementById('regY').value = "";
        };

        window.deletePlayer = async (id) => {
            if (auth.currentUser?.email === ADMIN_EMAIL && confirm("¿Eliminar?")) {
                await deleteDoc(doc(db, "jugadores", id));
            }
        };

        onSnapshot(collection(db, "jugadores"), (snapshot) => {
            const lista = document.getElementById('listaJugadores');
            lista.innerHTML = "";
            snapshot.forEach((doc) => {
                const data = doc.data();
                lista.innerHTML += `
                    <div class="flex justify-between items-center bg-slate-900/50 p-3 rounded-lg mb-2 border border-purple-900/30">
                        <div><span class="text-purple-400 font-bold">${data.nombre}</span> <span class="text-xs text-slate-500 ml-2 font-mono">${data.coords}</span></div>
                        <button onclick="deletePlayer('${doc.id}')" class="text-red-500 hover:text-white transition">✕</button>
                    </div>`;
            });
        });

        // --- CALCULADORA ---
        window.calcularAtaque = async () => {
            const ox = document.getElementById('origX').value;
            const oy = document.getElementById('origY').value;
            const dx = document.getElementById('destX').value;
            const dy = document.getElementById('destY').value;
            const fechaLlegada = new Date(document.getElementById('horaLlegada').value);
            const ahora = new Date();

            if(!ox || !oy || !dx || !dy || isNaN(fechaLlegada)) return alert("Datos incompletos");

            const dist = Math.sqrt(Math.pow(dx-ox, 2) + Math.pow(dy-oy, 2));
            const minFaltantes = (fechaLlegada - ahora) / 60000;

            const unidades = [
                { n: "Espías", v: 9 }, { n: "Ligera", v: 10 }, { n: "Hachas/Lanzas", v: 18 },
                { n: "Espadas", v: 22 }, { n: "Arietes/Catas", v: 30 }, { n: "Noble", v: 35 }
            ];

            let resH = `<p class="text-purple-300 font-bold text-center mb-2">Distancia: ${dist.toFixed(2)}</p>`;
            unidades.forEach(u => {
                const tReq = dist * u.v;
                const ok = minFaltantes >= tReq;
                resH += `<div class="flex justify-between text-xs py-1 border-b border-slate-800 ${ok ? 'text-green-400' : 'text-slate-600'}">
                    <span>${u.n}</span><span>${ok ? 'POSIBLE' : 'No llega'}</span>
                </div>`;
            });
            document.getElementById('resCalc').innerHTML = resH;

            // Cercanías
            const snapshot = await getDocs(collection(db, "jugadores"));
            let pueblos = [];
            snapshot.forEach(doc => {
                const d = doc.data();
                const [px, py] = d.coords.split('|');
                const distApoyo = Math.sqrt(Math.pow(dx-px, 2) + Math.pow(dy-py, 2));
                pueblos.push({...d, distApoyo});
            });
            pueblos.sort((a,b) => a.distApoyo - b.distApoyo);
            
            let cerH = `<h3 class="text-purple-400 text-xs font-bold mb-2">Cercanías al Destino:</h3>`;
            pueblos.slice(0, 5).forEach(p => {
                cerH += `<div class="flex justify-between text-[10px] mb-1 bg-slate-800/40 p-1 rounded">
                    <span>${p.nombre}</span><span class="text-purple-400">${p.distApoyo.toFixed(1)}c</span>
                </div>`;
            });
            document.getElementById('listaCercania').innerHTML = cerH;
        };

        onAuthStateChanged(auth, (user) => {
            const container = document.getElementById('authControls');
            if (user) {
                container.innerHTML = `<span class="text-[10px] text-slate-400 mr-2">${user.email}</span>
                                       <button onclick="logout()" class="bg-red-900/50 hover:bg-red-700 text-white px-3 py-1 rounded text-xs transition">Salir</button>`;
            } else {
                container.innerHTML = `<button onclick="login()" class="bg-purple-900/50 hover:bg-purple-700 text-white px-4 py-1 rounded text-xs transition">Login Admin</button>`;
            }
        });
    </script>
</head>
<body class="text-slate-200 p-4 min-h-screen">

    <div class="max-w-5xl mx-auto">
        <header class="flex justify-between items-center mb-8 border-b border-purple-900/30 pb-4">
            <div>
                <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-500 to-red-500 tracking-tighter">AURA OSCURA</h1>
            </div>
            <div id="authControls"></div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- PANEL REGISTRO -->
            <section class="bg-slate-900/80 p-6 rounded-2xl border border-purple-900/40 glow-purple">
                <h2 class="text-purple-400 text-sm font-bold mb-4 uppercase tracking-widest">Registrar Pueblo</h2>
                <div class="space-y-4">
                    <input type="text" id="name" placeholder="Nombre del Jugador" class="w-full bg-slate-950 p-3 rounded border border-slate-800 outline-none focus:border-purple-600">
                    <div class="flex gap-2">
                        <input type="number" id="regX" placeholder="Coord X" class="w-1/2 bg-slate-950 p-3 rounded border border-slate-800 outline-none focus:border-purple-600 text-center">
                        <input type="number" id="regY" placeholder="Coord Y" class="w-1/2 bg-slate-950 p-3 rounded border border-slate-800 outline-none focus:border-purple-600 text-center">
                    </div>
                    <button onclick="saveData()" class="w-full bg-purple-700 hover:bg-purple-600 py-3 rounded-lg font-bold transition uppercase text-sm">Guardar</button>
                </div>
                <div id="listaJugadores" class="mt-6 max-h-60 overflow-y-auto pr-2 text-sm"></div>
            </section>

            <!-- CALCULADORA -->
            <section class="bg-slate-900/80 p-6 rounded-2xl border border-red-900/30 glow-red">
                <h2 class="text-red-500 text-sm font-bold mb-4 uppercase tracking-widest">Oráculo de Ataque</h2>
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div class="space-y-1">
                        <label class="text-[10px] text-slate-500 uppercase">Origen (Enemigo)</label>
                        <div class="flex gap-1">
                            <input type="number" id="origX" placeholder="X" class="w-full bg-slate-950 p-2 rounded border border-slate-800 text-center">
                            <input type="number" id="origY" placeholder="Y" class="w-full bg-slate-950 p-2 rounded border border-slate-800 text-center">
                        </div>
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] text-slate-500 uppercase">Destino (Tribu)</label>
                        <div class="flex gap-1">
                            <input type="number" id="destX" placeholder="X" class="w-full bg-slate-950 p-2 rounded border border-slate-800 text-center">
                            <input type="number" id="destY" placeholder="Y" class="w-full bg-slate-950 p-2 rounded border border-slate-800 text-center">
                        </div>
                    </div>
                </div>
                <input type="datetime-local" id="horaLlegada" class="w-full bg-slate-950 p-3 rounded border border-slate-800 mb-4 text-sm" style="color-scheme:dark">
                <button onclick="calcularAtaque()" class="w-full bg-red-700 hover:bg-red-600 py-3 rounded-lg font-bold transition uppercase text-sm mb-6">Analizar</button>
                
                <div class="grid grid-cols-2 gap-4">
                    <div id="resCalc" class="bg-black/40 p-3 rounded-lg border border-slate-800 min-h-[100px]"></div>
                    <div id="listaCercania" class="bg-black/40 p-3 rounded-lg border border-slate-800 min-h-[100px]"></div>
                </div>
            </section>
        </div>
    </div>

</body>
</html>
