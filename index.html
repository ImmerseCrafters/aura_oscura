<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Oscura - Dashboard de Guerra</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts para dar aspecto épico -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3, .title-font { font-family: 'Cinzel', serif; }
        /* Efecto de brillo para Aura Oscura */
        .glow-purple { box-shadow: 0 0 15px rgba(147, 51, 234, 0.3); }
        .glow-red { box-shadow: 0 0 15px rgba(220, 38, 38, 0.3); }
        /* Scrollbar personalizada */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #6b21a8; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #9333ea; }
    </style>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // --- 1. CONFIGURACIÓN DE FIREBASE (¡Sustituye por tus datos!) ---
        const firebaseConfig = {
  apiKey: "AIzaSyCRdip4voDHkV_b5r_Wl722fX8j7zUxTKg",
  authDomain: "aura-oscura.firebaseapp.com",
  projectId: "aura-oscura",
  storageBucket: "aura-oscura.firebasestorage.app",
  messagingSenderId: "628625847037",
  appId: "1:628625847037:web:eaaeea7059a7b4695ec494"
};

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();
        
        // --- 2. CONFIGURACIÓN DEL ADMINISTRADOR ---
        const ADMIN_EMAIL = "tu-correo@gmail.com"; // CAMBIA ESTO POR TU CORREO

        // --- 3. GESTIÓN DE DATOS ---
        window.saveData = async () => {
            const user = auth.currentUser;
            if (!user || user.email !== ADMIN_EMAIL) return alert("El Aura Oscura te rechaza. No eres el administrador.");
            
            const nombre = document.getElementById('name').value;
            const coords = document.getElementById('coords').value;
            
            if(!nombre || !coords) return alert("Faltan datos para el ritual (Rellena nombre y coordenadas).");

            try {
                await addDoc(collection(db, "jugadores"), { nombre, coords });
                document.getElementById('name').value = "";
                document.getElementById('coords').value = "";
            } catch (error) {
                alert("Error al guardar: " + error.message);
            }
        };

        window.deletePlayer = async (id) => {
            const user = auth.currentUser;
            if (user && user.email === ADMIN_EMAIL) {
                if(confirm("¿Condenar este pueblo al olvido? (Eliminar)")) {
                    await deleteDoc(doc(db, "jugadores", id));
                }
            } else {
                alert("No tienes el poder para eliminar registros.");
            }
        };

        // Escuchar BBDD en tiempo real
        onSnapshot(collection(db, "jugadores"), (snapshot) => {
            const lista = document.getElementById('listaJugadores');
            lista.innerHTML = "";
            snapshot.forEach((doc) => {
                const data = doc.data();
                lista.innerHTML += `
                    <div class="flex justify-between items-center bg-slate-800/80 p-3 rounded-lg mb-2 border border-purple-900/50 hover:border-purple-600 transition">
                        <div>
                            <span class="font-bold text-purple-400">${data.nombre}</span> 
                            <span class="text-sm text-slate-400 ml-2 font-mono">[${data.coords}]</span>
                        </div>
                        <button onclick="deletePlayer('${doc.id}')" class="text-red-500 hover:text-red-400 font-bold px-2 text-lg drop-shadow-md transition">⚔️</button>
                    </div>
                `;
            });
        }, (error) => {
            console.error("Error leyendo BBDD:", error);
        });

        // --- 4. CALCULADORA Y PUEBLOS CERCANOS ---
        window.calcularAtaque = async () => {
            const origenRaw = document.getElementById('origen').value;
            const destinoRaw = document.getElementById('destino').value;
            const fechaLlegada = new Date(document.getElementById('horaLlegada').value);
            const ahora = new Date();

            if(!origenRaw.includes('|') || !destinoRaw.includes('|') || isNaN(fechaLlegada)) {
                return alert("Las coordenadas deben tener el formato xxx|yyy y la fecha debe ser válida.");
            }

            const c1 = origenRaw.split('|');
            const c2 = destinoRaw.split('|');
            const distTarget = Math.sqrt(Math.pow(c2[0]-c1[0], 2) + Math.pow(c2[1]-c1[1], 2));
            const minFaltantes = (fechaLlegada - ahora) / 60000;

            const unidades = [
                { n: "Espías", v: 9 }, { n: "Ligera / Paladín", v: 10 }, { n: "Pesada", v: 11 }, { n: "Hachas/Lanzas", v: 18 },
                { n: "Espadas", v: 22 }, { n: "Arietes/Catas", v: 30 }, { n: "Noble", v: 35 }
            ];

            let resIdentificacion = `<p class="mb-3 text-purple-300 font-bold text-center border-b border-purple-800 pb-2">Distancia: ${distTarget.toFixed(2)} casillas</p>`;
            unidades.forEach(u => {
                const tReq = distTarget * u.v;
                const ok = minFaltantes >= tReq;
                resIdentificacion += `<div class="flex justify-between border-b border-slate-700/50 py-1.5 ${ok ? 'text-green-400 font-semibold' : 'text-slate-600'}">
                    <span>${u.n}</span>
                    <span>${ok ? '⚠️ POSIBLE' : 'Descartado'} <span class="text-xs text-slate-500">(${Math.round(tReq)}m)</span></span>
                </div>`;
            });
            document.getElementById('resCalc').innerHTML = resIdentificacion;

            // Lógica de Pueblos Cercanos
            try {
                const snapshot = await getDocs(collection(db, "jugadores"));
                let pueblosCercanos = [];

                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const pCoord = data.coords.split('|');
                    const d = Math.sqrt(Math.pow(c2[0]-pCoord[0], 2) + Math.pow(c2[1]-pCoord[1], 2));
                    pueblosCercanos.push({ ...data, distancia: d });
                });

                pueblosCercanos.sort((a, b) => a.distancia - b.distancia);

                let resCercania = `<h3 class="text-purple-400 font-bold mb-3 border-b border-purple-900 pb-1 flex items-center gap-2">🛡️ Apoyos más cercanos</h3>`;
                if (pueblosCercanos.length === 0) {
                    resCercania += `<p class="text-sm text-slate-500">No hay tropas del Aura Oscura registradas.</p>`;
                } else {
                    pueblosCercanos.slice(0, 5).forEach(p => {
                        resCercania += `
                            <div class="flex justify-between text-sm mb-2 bg-slate-900/50 p-2 rounded border border-purple-900/30">
                                <span class="font-semibold text-slate-200">${p.nombre} <span class="font-normal text-slate-500 ml-1">[${p.coords}]</span></span>
                                <span class="text-purple-400 font-mono">${p.distancia.toFixed(1)} c.</span>
                            </div>`;
                    });
                }
                document.getElementById('listaCercania').innerHTML = resCercania;
            } catch (error) {
                console.error("Error obteniendo pueblos:", error);
            }
        };

        // --- 5. LOGIN CON GESTIÓN DE ERRORES ---
        window.login = async () => {
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                console.error("Error de Auth:", error);
                alert("El login falló.\nCódigo de error: " + error.code + "\nMensaje: " + error.message + "\n\n¿Has habilitado Google Auth en Firebase y añadido tu dominio en Authorized Domains?");
            }
        };
        
        onAuthStateChanged(auth, (user) => {
            const btn = document.getElementById('loginBtn');
            if (user) {
                btn.innerHTML = `Conectado: <span class="text-purple-300">${user.email}</span>`;
                btn.classList.replace('bg-slate-800', 'bg-slate-900');
                btn.classList.add('border-purple-500', 'glow-purple');
            } else {
                btn.innerText = "Invocar Admin (Login)";
                btn.classList.replace('bg-slate-900', 'bg-slate-800');
                btn.classList.remove('border-purple-500', 'glow-purple');
            }
        });
    </script>
</head>
<body class="bg-slate-950 text-slate-200 p-4 md:p-8 min-h-screen relative overflow-x-hidden">

    <!-- Fondo decorativo sutil -->
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[800px] h-[800px] bg-purple-900/10 rounded-full blur-[120px] pointer-events-none -z-10"></div>

    <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-10 relative z-10">
        
        <!-- COLUMNA IZQUIERDA: GESTIÓN -->
        <div>
            <header class="mb-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                    <h1 class="text-4xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-red-600 tracking-widest drop-shadow-lg">AURA OSCURA</h1>
                    <p class="text-slate-500 text-sm mt-1 uppercase tracking-widest">Panel de Comando</p>
                </div>
                <button id="loginBtn" onclick="login()" class="text-xs bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded border border-slate-700 transition shadow-lg uppercase tracking-wider font-bold">Invocar Admin</button>
            </header>

            <section class="bg-slate-900/80 backdrop-blur-sm p-6 md:p-8 rounded-2xl shadow-2xl border border-purple-900/40 glow-purple">
                <h2 class="text-xl mb-6 flex items-center text-purple-400 border-b border-purple-900/50 pb-2">
                    <span class="mr-2">🗡️</span> Registrar Fuerzas
                </h2>
                <div class="space-y-4">
                    <div>
                        <label class="text-xs text-purple-400/70 ml-1 uppercase tracking-wide">Identificación</label>
                        <input type="text" id="name" placeholder="Ej: Señor Oscuro / Aldea Main" class="w-full bg-slate-950 p-3 rounded-lg border border-slate-800 focus:border-purple-500 outline-none transition text-slate-200 mt-1">
                    </div>
                    <div>
                        <label class="text-xs text-purple-400/70 ml-1 uppercase tracking-wide">Ubicación</label>
                        <input type="text" id="coords" placeholder="Ej: 500|500" class="w-full bg-slate-950 p-3 rounded-lg border border-slate-800 focus:border-purple-500 outline-none transition text-slate-200 mt-1">
                    </div>
                    <button onclick="saveData()" class="w-full bg-gradient-to-r from-purple-800 to-purple-600 hover:from-purple-700 hover:to-purple-500 py-3 rounded-lg font-black transition shadow-lg text-white uppercase tracking-widest mt-4 border border-purple-500/30">Registrar en el Códice</button>
                </div>

                <h2 class="text-xl mt-10 mb-4 flex items-center text-purple-400 border-b border-purple-900/50 pb-2">
                    <span class="mr-2">📜</span> Dominios Registrados
                </h2>
                <div id="listaJugadores" class="max-h-[400px] overflow-y-auto pr-3">
                    <p class="text-slate-500 text-sm italic text-center py-4">Estableciendo conexión con el vacío...</p>
                </div>
            </section>
        </div>

        <!-- COLUMNA DERECHA: CALCULADORA -->
        <div class="mt-0 lg:mt-6">
            <section class="bg-slate-900/80 backdrop-blur-sm p-6 md:p-8 rounded-2xl shadow-2xl border border-red-900/30 glow-red">
                <h2 class="text-2xl mb-6 text-red-500 flex items-center border-b border-red-900/30 pb-2">
                    <span class="mr-2">🔥</span> Oráculo de Guerra
                </h2>
                
                <div class="grid grid-cols-2 gap-4 mb-5">
                    <div>
                        <label class="text-xs text-red-400/70 ml-1 uppercase tracking-wide">Origen (Enemigo)</label>
                        <input type="text" id="origen" placeholder="xxx|yyy" class="w-full bg-slate-950 p-3 rounded-lg border border-slate-800 focus:border-red-500 outline-none transition text-slate-200 mt-1">
                    </div>
                    <div>
                        <label class="text-xs text-red-400/70 ml-1 uppercase tracking-wide">Destino (Tribu)</label>
                        <input type="text" id="destino" placeholder="xxx|yyy" class="w-full bg-slate-950 p-3 rounded-lg border border-slate-800 focus:border-red-500 outline-none transition text-slate-200 mt-1">
                    </div>
                </div>

                <div class="mb-6">
                    <label class="text-xs text-red-400/70 ml-1 uppercase tracking-wide">Impacto Inminente</label>
                    <input type="datetime-local" id="horaLlegada" class="w-full bg-slate-950 p-3 rounded-lg border border-slate-800 text-slate-200 focus:border-red-500 outline-none transition mt-1 color-scheme-dark" style="color-scheme: dark;">
                </div>
                
                <button onclick="calcularAtaque()" class="w-full bg-gradient-to-r from-red-800 to-red-600 hover:from-red-700 hover:to-red-500 py-4 rounded-lg font-black transition shadow-lg tracking-widest text-white uppercase border border-red-500/30">Desentrañar Ataque</button>
                
                <!-- Resultados -->
                <div class="grid grid-cols-1 xl:grid-cols-2 gap-4 mt-8">
                    <div id="resCalc" class="bg-slate-950/80 p-5 rounded-xl border border-slate-800 text-sm shadow-inner">
                        <p class="text-slate-500 italic text-center mt-4">Esperando coordenadas...</p>
                    </div>

                    <div id="listaCercania" class="bg-slate-950/80 p-5 rounded-xl border border-slate-800 text-sm shadow-inner">
                        <p class="text-slate-500 italic text-center mt-4">Las tropas más cercanas responderán al llamado aquí...</p>
                    </div>
                </div>
            </section>
        </div>

    </div>

</body>
</html>
